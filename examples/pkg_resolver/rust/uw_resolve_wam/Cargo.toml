[package]
name = "uw_resolve_wam"
version = "0.1.0"
edition = "2021"
description = "Generated by UnifyWeaver WAM-to-Rust transpilation"

[[bin]]
name = "bench"
path = "src/main.rs"

[dependencies]
mimalloc = { version = "0.1", optional = true }

[features]
default = ["decorate_sort", "intern", "intern_fxhash", "intern_sym_thread", "deref_memo", "trail_enum", "store_cache", "mimalloc"]
# When off, the sort/msort/keysort/setof builtins fall back to the original
# `term_compare` (re-deref) path; output is byte-identical to the on build.
decorate_sort = []
# Hot-path opt #2 (D96): intern functor/atom/var names to u32 ids so term
# construction, `deref_var` and the `"f/N"` functor parse stop allocating tiny
# name Strings. Default ON (A/B: B3 -29% Ir/-29% wall, B2 -41% Ir/-32% wall,
# byte-identical). Off = the pre-intern String path, kept for A/B via
# `--no-default-features --features decorate_sort`; the two are sha-distinct.
intern = []
# Hot-path opt #8 (D112): swap the interner name->id lookup map from std's
# default SipHash to the crate's FxHash (state.rs `FxBuildHasher`). The D111
# post-mimalloc re-profile put interner hashing at 8.1% of B3 Ir (`hash_one`
# 4.5% + `sip::write` 3.7%) -- every `intern()` SipHashes the name string to
# probe the map. Byte-identical BY CONSTRUCTION: a name's id comes from the
# `len` first-sight counter, never the hash, and the map's iteration order is
# never observed, so the hasher cannot change any id or output. Default ON.
# Off = the exact pre-D112 SipHash map; the isolated A/B baseline (mimalloc held ON, only this lever toggled) is
# `--no-default-features --features "decorate_sort intern deref_memo trail_enum store_cache mimalloc"`.
intern_fxhash = []
# Hot-path opt #9 (D113): thread interned `Sym` ids through term construction so
# the hot deref/rebuild sites (deref_heap Str + Ref arms, heap_node_shallow,
# deref_shallow) build a `Value::Str` functor from a cached id instead of
# de-interning an existing `Sym` to `&str` and RE-interning it (a round-trip
# that re-hashes on every rebuild). The functor name/inner are interned ONCE per
# functor id, cached in the id-keyed `Decomp` (`name_sym`/`inner_sym`), and read
# back via `crate::value::functor_sym`. Byte-identical BY CONSTRUCTION: the
# cached id IS `intern(name)`/`intern(inner)`, interning is canonical, so it
# resolves to the exact string the old `functor.into()` produced. Requires
# `intern` (ids); a no-op fallback to the pre-D113 intern path otherwise.
# Default ON. Off = the exact pre-D113 re-intern path, isolated A/B baseline via
# `--no-default-features --features "decorate_sort intern intern_fxhash deref_memo trail_enum store_cache mimalloc"`.
intern_sym_thread = []
# Hot-path opt #5 (D103): cache deref-stability on the Arc-shared Args spine so
# `deref_heap` skips re-walking + rebuilding already-canonical (ground, no
# "f/N" functor, no cons-Str) terms. The flag is set ONLY from deref_heap's
# own verified verbatim-identity path, so an ON short-circuit is byte-identical
# to the OFF full walk. Default ON. Off = the exact pre-D103 deref_heap (no
# cache field consulted), a perfect A/B baseline, via
# `--no-default-features --features "decorate_sort intern"`.
deref_memo = []
# Hot-path opt #6 (D104): enum-tag the backtrack trail (D94 #4 lever, B2 bind
# path). `TrailEntry.key` becomes `TrailKey::Binding(name)` / `Register(name)`
# instead of a `String`, so `bind_var` stops `format!("__binding__{}")`-concat-
# allocating on every variable bind and `unwind_trail_to` matches the variant
# instead of `strip_prefix`-parsing on every unwind (also removes any risk of a
# register name colliding with the `"__binding__"` prefix). Default ON. Off =
# the exact pre-D104 `format!`/`strip_prefix` String path, a perfect A/B
# baseline, via `--no-default-features --features "decorate_sort intern deref_memo"`;
# output is byte-identical ON vs OFF.
trail_enum = []
# Hot-path opt #7 (D106): L1 decoded-row cache on SeekFactSource (D43 store
# seek path). A bound-key seek caches its decoded `Vec<(Value, Value)>` rows
# (verbatim, in seek order) by the tagged lookup key, so a repeat seek for the
# same key skips the .idx binary search and the .data reads/decode. The store
# is read-only for the life of a resolve, so a key always yields the same
# rows -- byte-safe by construction. `scan_all` (unbound arg1) is never cached.
# Default ON. Off = the exact pre-D106 seek path (no cache field consulted),
# a perfect A/B baseline, via
# `--no-default-features --features "decorate_sort intern deref_memo trail_enum"`;
# output is byte-identical ON vs OFF.
store_cache = []
# D108: real LMDB reader for SeekFactSource's lmdb(Dir) tier (opt-in, NON-
# default parity backend -- see docs/reports/wam_rust_lmdb_store_backend.md).
# Gated behind this feature (rather than always compiling `use lmdb_zero`)
# because seek_fact_source.rs is emitted into EVERY wam_rust crate
# unconditionally, most of which never add lmdb-zero as a dependency; the
# feature is declared in every crate's [features] table (empty when unused,
# exactly like `parallel` below) so `#[cfg(feature = "store_lmdb")]` never
# trips Cargo's unexpected-cfgs lint. Auto-default-ON ONLY for a project whose
# rust_wam_fact_sources are lmdb(Dir) (this Cargo.toml then also carries a
# real, non-optional lmdb-zero dependency); every other project leaves it
# out of `default` and never links lmdb-zero at all. When off (or absent),
# `SeekFactSource::rows` on an lmdb(Dir) source fails loudly at query time
# (`lmdb_seek_missing_error`) -- never a silent fallback to indexed(...).
store_lmdb = []
# D110: mimalloc as the process global allocator (drop-in swap -- changes HOW
# memory is allocated, not WHAT is computed, so output is byte-identical to
# the system-allocator build BY CONSTRUCTION). Motivated by the D109
# re-profile: glibc malloc internals were about 37% of B3 Ir on the term path.
# `mimalloc` is an OPTIONAL dependency (vendors + `cc`-compiles the mimalloc
# C source; no system lib needed) gated behind this feature via Cargo's
# `dep:mimalloc` syntax, exactly like `store_lmdb` above, so an OFF build
# (`--no-default-features --features "decorate_sort intern deref_memo trail_enum store_cache"`)
# never fetches or compiles the mimalloc crate at all. OFF by default in the
# generator so a plain generated crate has no external deps and builds under
# `cargo build --offline` (the conformance-smoke invariant); the pkg_resolver
# benches opt in via the `mimalloc(true)` build option, which flips this line to
# `mimalloc = ["dep:mimalloc"]` and adds "mimalloc" to `default`. When off the
# feature is emitted empty (`mimalloc = []`) and the optional dep line is
# omitted, so cargo never resolves mimalloc from the registry index. The
# `#[global_allocator]` static itself lives in each BINARY crate root (never
# lib.rs) -- src/main.rs (the `bench` bin) and the hand-written shim
# `src/bin/uw_resolve/main.rs` / `src/bin/uw_resolve_store/main.rs` -- each
# gated behind `#[cfg(feature = "mimalloc")]`, so an OFF build links the
# system (glibc) allocator instead. See docs/reports/wam_rust_mimalloc_ab.md.
mimalloc = ["dep:mimalloc"]
# T7 parallel-aggregate path (state.rs `#[cfg(feature="parallel")]`). Declared
# so Cargo's unexpected-cfgs lint knows the name (adding [features] above turns
# that lint on). Off by default and empty: enabling it needs rayon, which is a
# hard dep only under the generator's parallel(true) option.
parallel = []
